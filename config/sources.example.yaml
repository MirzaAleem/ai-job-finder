# Career-page scraping targets for the `companies` source.
# Copy to config/sources.yaml and edit:
#   cp config/sources.example.yaml config/sources.yaml
#
# IMPORTANT: these selectors are examples, not verified integrations. Every
# career site is different. Open the page, inspect it, and write the selectors
# that actually match. An empty result means your selectors are wrong, not that
# the company has no openings.
#
# Every URL below still passes through the robots.txt gate at runtime. If a site
# disallows the path, the fetch is refused and the company is skipped.

companies:
  # --- VERIFIED WORKING (tested 2026-09-12 against a live board) -------------
  # Greenhouse-hosted boards all share this markup, so this entry works for any
  # company on job-boards.greenhouse.io — just change `company` and the slug.
  # Greenhouse's robots.txt permits crawling and serves an honestly-identified
  # client, which is why this one actually runs.
  - company: Anthropic
    url: https://job-boards.greenhouse.io/anthropic
    listSelector: 'tr.job-post'
    fields:
      title: 'a p.body--medium'
      link: 'a'
      location: 'a p.body--metadata'
    waitForSelector: 'tr.job-post'
    # Greenhouse pages at 50 jobs. Without this block you get only the first 50
    # — GitLab, for instance, has 227. Verified: 5 pages, stops on the partial
    # final page of 27.
    pagination:
      type: query # query -> ?page=2   ·   path -> /page/2
      param: page
      startPage: 1
      maxPages: 10 # ceiling, not a target; paging stops when the board ends
    enabled: false

  # --- Lever boards render every job on one page. Omit `pagination` entirely;
  #     adding it just costs one wasted request per board.
  - company: Example on Lever
    url: https://jobs.lever.co/example
    listSelector: '.posting'
    fields:
      title: '.posting-title h5'
      link: 'a.posting-title'
      location: '.posting-categories .location'
    waitForSelector: '.posting'
    enabled: false

  # --- TEMPLATES (placeholders — write your own selectors) -------------------
  - company: Example Corp
    url: https://careers.example.com/openings
    # One element per job listing.
    listSelector: 'div.job-listing'
    # Selectors are relative to each listing element.
    fields:
      title: 'h3.job-title'
      link: 'a.job-link'
      location: 'span.job-location'
      department: 'span.job-department'
    # Optional: wait for this before extracting (for JS-rendered pages).
    waitForSelector: 'div.job-listing'
    enabled: false

  - company: Another Example
    url: https://another-example.com/careers
    listSelector: "[data-testid='job-card']"
    fields:
      title: "[data-testid='job-title']"
      link: 'a'
      location: "[data-testid='job-location']"
    enabled: false
